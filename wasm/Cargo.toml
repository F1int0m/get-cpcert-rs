[package]
name = "get-cpcert-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for get-cpcert: extract CryptoPro certificates in the browser"
license = "GPL-2.0-or-later"
repository = "https://github.com/metron8/get-cpcert-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
get-cpcert = { path = ".." }

# WASM tooling — pinned to versions that work with rustc 1.75 and the
# already-pinned versions of other crates.
wasm-bindgen = "=0.2.92"

# Better panic messages in the browser console.
console_error_panic_hook = { version = "=0.1.7", optional = true }

[features]
default = ["console_error_panic_hook"]
